services:
  react-app:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    command: npm run dev:docker
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./:/app
      - react_app_node_modules:/app/node_modules
    environment:
      # Required: Docker Desktop on Windows does not deliver filesystem events through the
      # bind mount, so without this an edit on the host is never noticed. It is expensive -
      # vite.config.ts pairs it with a 3s poll interval, because chokidar's 100ms default
      # starves the dev server. Read the comment there before changing either one.
      - CHOKIDAR_USEPOLLING=true
      - ORVAL_OPENAPI_URL=http://host.docker.internal:8080/docs/api.json
    networks:
      - shared-network
    stdin_open: true
    tty: true

  storybook:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    command: npm run storybook:docker
    ports:
      - "${STORYBOOK_PORT:-6006}:6006"
    volumes:
      - ./:/app
      - storybook_node_modules:/app/node_modules
    networks:
      - shared-network


volumes:
  react_app_node_modules:
    driver: local
  storybook_node_modules:
    driver: local

networks:
  shared-network:
    driver: bridge