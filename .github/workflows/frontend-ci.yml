name: Frontend CI

on:
  push:
    branches:
      - master
    paths:
      - "client/**"
      - "processor-api/api.json"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches:
      - develop
      - master
    paths:
      - "client/**"
      - "processor-api/api.json"
      - ".github/workflows/frontend-ci.yml"

# SECURITY TODO: `vars.RENDER_DEPLOY_HOOK_URL` must become `secrets.RENDER_DEPLOY_HOOK_URL`.
# Repository variables are NOT masked in run logs, and the steps below interpolate the
# value straight into `run:` scripts, so the deploy hook URL is printed in plain text.
# Anyone who reads it can trigger a production deploy. Render documents the hook URL as
# confidential. Fix: move it to secrets, pass it through `env:` instead of inline
# `${{ }}`, then regenerate the hook in the Render dashboard to invalidate the leaked one.
# Tracked in docs/architecture/ci-and-containers-audit.md (finding H1).

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/japanese-vma-client

jobs:
  verify:
    name: Verify frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Ensure frontend build variable exists
        run: |
          if [ -z "${{ vars.CLIENT_VITE_API_URL }}" ]; then
            echo "CLIENT_VITE_API_URL repository variable is required."
            exit 1
          fi

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json

      # setup-node's `cache: npm` only caches ~/.npm (the download cache), so
      # `npm ci` still re-extracts all ~950 packages every run. Caching
      # node_modules itself lets us skip the install outright when the lockfile
      # is unchanged. Exact key only: a partial restore is worse than a clean
      # install, so no restore-keys here.
      - name: Cache node_modules
        id: node-modules-cache
        uses: actions/cache@v5
        with:
          path: client/node_modules
          key: node-modules-${{ runner.os }}-node${{ steps.setup-node.outputs.node-version }}-${{ hashFiles('client/package-lock.json') }}

      - name: Install dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Generate Orval client
        run: npm run orval:file

      # Hand the generated client to the publish job so it does not need Node,
      # node_modules or a second Orval run just to populate the build context.
      - name: Upload generated API client
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v7
        with:
          name: orval-client
          path: client/src/api/generated
          retention-days: 1
          if-no-files-found: error

      - name: Typecheck
        env:
          VITE_API_URL: ${{ vars.CLIENT_VITE_API_URL }}
        run: npm run typecheck

      # No separate `npm run build` here: the production image build below runs
      # the same `vite build`, and vite-plugin-checker runs TypeScript and ESLint
      # during it. The native build produced an artifact nothing consumed.
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # A plain `docker build` on a fresh runner has no layer cache, so the
      # `RUN npm ci` inside the Dockerfile downloaded all ~950 packages on every
      # run. Buildx with the GitHub Actions cache backend reuses that layer
      # whenever package-lock.json is unchanged. The Dockerfile copies
      # package*.json before the install and the source after it, so source-only
      # changes keep the install layer intact. `load: true` puts the image in the
      # local daemon for the smoke test below. Shared `scope` lets the publish
      # job reuse this cache.
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/.docker/Dockerfile.production
          push: false
          load: true
          tags: japanese-vma-client:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.CLIENT_VITE_API_URL }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=ci
            VITE_SENTRY_RELEASE=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke test production image
        run: |
          docker rm -f japanese-vma-client-smoke >/dev/null 2>&1 || true
          trap 'docker rm -f japanese-vma-client-smoke >/dev/null 2>&1 || true' EXIT

          docker run -d --name japanese-vma-client-smoke -e PORT=8080 -p 18080:8080 japanese-vma-client:${{ github.sha }}

          for attempt in $(seq 1 30); do
            root_status="$(curl -s -o smoke-root.html -w "%{http_code}" http://127.0.0.1:18080/ || true)"

            if [ "$root_status" = "200" ] && grep -q 'id="root"' smoke-root.html; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              docker logs japanese-vma-client-smoke || true
              [ -f smoke-root.html ] && cat smoke-root.html
              exit 1
            fi

            sleep 2
          done

          nested_status="$(curl -s -o smoke-route.html -w "%{http_code}" http://127.0.0.1:18080/articles/test || true)"

          if [ "$nested_status" != "200" ] || ! grep -q 'id="root"' smoke-route.html; then
            docker logs japanese-vma-client-smoke || true
            [ -f smoke-route.html ] && cat smoke-route.html
            exit 1
          fi

  publish:
    name: Publish frontend image
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Ensure production frontend variables exist
        run: |
          if [ -z "${{ vars.VITE_SENTRY_DSN }}" ]; then
            echo "VITE_SENTRY_DSN repository variable is required."
            exit 1
          fi

          if [ -z "${{ vars.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL repository variable is required."
            exit 1
          fi

      # No Node setup or npm install here. The only reason this job needed them
      # was to regenerate the Orval client into the Docker build context, and
      # the verify job already produced exactly that.
      - name: Download generated API client
        uses: actions/download-artifact@v8
        with:
          name: orval-client
          path: client/src/api/generated

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/.docker/Dockerfile.production
          push: true
          build-args: |
            VITE_API_URL=${{ vars.CLIENT_VITE_API_URL }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=production
            VITE_SENTRY_RELEASE=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Reuses the layers the verify job just built. Build args declared
          # after `RUN npm ci` in the Dockerfile, so the ci/production split
          # does not invalidate the install layer.
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-production:
    name: Deploy production frontend
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    steps:
      - name: Ensure production deploy hook exists
        run: |
          if [ -z "${{ vars.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL repository variable is required."
            exit 1
          fi

      # SECURITY TODO (H1): this line prints the deploy hook URL in the run log
      # because `vars` is not masked. Move to `secrets.RENDER_DEPLOY_HOOK_URL` and
      # reference it through `env:` so the value is masked. See note at top of file.
      - name: Trigger Render deploy
        run: curl --fail --silent --show-error -X POST "${{ vars.RENDER_DEPLOY_HOOK_URL }}"
