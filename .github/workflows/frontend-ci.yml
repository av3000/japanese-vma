name: Frontend CI

on:
  push:
    branches:
      - master
      - develop
    paths:
      - "client/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/frontend-ci.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/japanese-vma-client

jobs:
  verify:
    name: Verify frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure frontend build variable exists
        run: |
          if [ -z "${{ vars.CLIENT_VITE_API_URL }}" ]; then
            echo "CLIENT_VITE_API_URL repository variable is required."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        env:
          VITE_API_URL: ${{ vars.CLIENT_VITE_API_URL }}
        run: npm run typecheck

      - name: Build frontend
        env:
          VITE_API_URL: ${{ vars.CLIENT_VITE_API_URL }}
        run: npm run build

      - name: Build production image
        run: docker build --build-arg VITE_API_URL="${{ vars.CLIENT_VITE_API_URL }}" -f .docker/Dockerfile.production -t japanese-vma-client:${{ github.sha }} .

      - name: Smoke test production image
        run: |
          docker rm -f japanese-vma-client-smoke >/dev/null 2>&1 || true
          trap 'docker rm -f japanese-vma-client-smoke >/dev/null 2>&1 || true' EXIT

          docker run -d --name japanese-vma-client-smoke -e PORT=8080 -p 18080:8080 japanese-vma-client:${{ github.sha }}

          for attempt in $(seq 1 30); do
            root_status="$(curl -s -o smoke-root.html -w "%{http_code}" http://127.0.0.1:18080/ || true)"

            if [ "$root_status" = "200" ] && grep -q 'id="root"' smoke-root.html; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              docker logs japanese-vma-client-smoke || true
              [ -f smoke-root.html ] && cat smoke-root.html
              exit 1
            fi

            sleep 2
          done

          nested_status="$(curl -s -o smoke-route.html -w "%{http_code}" http://127.0.0.1:18080/articles/test || true)"

          if [ "$nested_status" != "200" ] || ! grep -q 'id="root"' smoke-route.html; then
            docker logs japanese-vma-client-smoke || true
            [ -f smoke-route.html ] && cat smoke-route.html
            exit 1
          fi

  publish:
    name: Publish frontend image
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/.docker/Dockerfile.production
          push: true
          build-args: |
            VITE_API_URL=${{ vars.CLIENT_VITE_API_URL }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
