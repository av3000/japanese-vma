name: jvma-test

services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: japanese_vma_test
      POSTGRES_USER: japanese_vma_test
      POSTGRES_PASSWORD: japanese_vma_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.0.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  test-runner:
    build:
      context: .
      dockerfile: .docker/Dockerfile
      args:
        INSTALL_DEV_DEPENDENCIES: "true"
    env_file: .env.testing
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - test_vendor:/var/www/html/vendor
    entrypoint: ["/bin/sh", "/var/www/html/.docker/test-runner-entrypoint.sh"]
    depends_on:
      db-test:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test \"$$APP_ENV\" = \"testing\" && php artisan about > /dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  test_vendor:
