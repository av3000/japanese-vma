name: jvma-test

services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: japanese_vma_test
      POSTGRES_USER: japanese_vma_test
      POSTGRES_PASSWORD: japanese_vma_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.0.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  test-runner:
    build:
      context: .
      dockerfile: .docker/Dockerfile
      args:
        INSTALL_DEV_DEPENDENCIES: "true"
    env_file: .env.testing
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - test_vendor:/var/www/html/vendor
    entrypoint: ["/bin/sh", "/var/www/html/.docker/test-runner-entrypoint.sh"]
    depends_on:
      db-test:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Ready means: the testing env is set and Composer's autoloader loads. That takes
    # about 0.2 s. `php artisan about`, the old check, boots the whole app over the
    # Windows bind mount in about 8 s, past the 3 s timeout, so the runner never turned
    # healthy and `up --wait` always failed.
    # When the `test_vendor` volume is empty, the entrypoint runs `composer install`,
    # which takes minutes. Failures during `start_period` do not count, so `up --wait`
    # waits for the install.
    healthcheck:
      test: ["CMD-SHELL", "test \"$$APP_ENV\" = \"testing\" && php -r 'require \"vendor/autoload.php\";'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10m
      start_interval: 3s

volumes:
  test_vendor:
