services:
  worker:
    image: ${IMAGE_NAME}
    restart: unless-stopped
    env_file:
      - .env.worker
    healthcheck:
      test:
        - CMD-SHELL
        - php artisan horizon:status >/dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    command:
      - /bin/sh
      - -lc
      - exec php artisan horizon
